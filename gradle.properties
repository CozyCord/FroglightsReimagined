# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.caching.debug=false
org.gradle.configuration-cache=false
org.gradle.configureondemand=true

# Skip Loom's Mercury source-remap of Fabric API sub-jars on Windows.
# The source-remap step is a Windows file-handle race that fails
# intermittently on multi-version Stonecutter builds (esp. 1.21.11).
# Only enable this if you don't need IDE navigation to fabric-api sources by yarn name.
systemProp.fabric.loom.ci=true

# Mod Properties
mod.id=froglightsreimagined
mod.name=FroglightsReimagined
mod.version=0.4
mod.group=net.cozystudios.froglightsreimagined
mod.description=We felt like Froglights needed some more love, so we created a variety of colors, blocks, and crafting recipes for an amazing block.
